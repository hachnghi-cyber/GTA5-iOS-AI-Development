# Police RP R38: build an unsigned iPhoneOS ARM64 dylib, NOT a game IPA.
# Manual-only workflow to conserve the personal plan's free macOS minutes.
# This file belongs at the Git repository root as codemagic.yaml.
workflows:
  police-rp-r38-ios-dylib:
    name: Police RP R38 iPhoneOS dylib - no game IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Verify R38 source and Xcode iPhoneOS SDK
        script: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          printf '%s\n' '03d13f1848443ec7e7d23f0f7eedad6e922e79ec5e36b4d358e4d04642ce1810  research/police-rp-r38/r38-ios-source.tar.xz' | shasum -a 256 -c -
          mkdir -p ci-r38
          tar -xJf research/police-rp-r38/r38-ios-source.tar.xz -C ci-r38
          test "$(find ci-r38/src -maxdepth 1 -name '*.c' | wc -l | tr -d ' ')" -eq 28
          test -f ci-r38/ios/build_r38.sh
          test -f ci-r38/tools/verify_r38_macho.py
          if find ci-r38 -type f \( -name '*.ipa' -o -name '*.rpf' -o -name '*.p12' -o -name '*.mobileprovision' \) | grep -q .; then
            echo 'Unexpected game assets or signing credentials in source' >&2
            exit 1
          fi
      - name: Compile 34 modules and verify linked ARM64 iOS dylib
        script: |
          set -euo pipefail
          cd ci-r38
          sh ios/build_r38.sh
          python3 tools/verify_r38_macho.py build/ios-r38/libPoliceRP_R38.dylib
          shasum -a 256 build/ios-r38/libPoliceRP_R38.dylib > build/ios-r38/R38-sha256.txt
          printf '%s\n' 'UNSIGNED iPhoneOS dylib only. RAGE sender hooks/gameplay not yet verified. NO GTA IPA included.' > build/ios-r38/README.txt
    artifacts:
      - ci-r38/build/ios-r38/libPoliceRP_R38.dylib
      - ci-r38/build/ios-r38/R38-macho-report.json
      - ci-r38/build/ios-r38/R38-load-commands.txt
      - ci-r38/build/ios-r38/R38-exports.txt
      - ci-r38/build/ios-r38/R38-sha256.txt
      - ci-r38/build/ios-r38/README.txt
