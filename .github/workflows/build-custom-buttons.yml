name: GTA V iOS v11.2 Custom Buttons (BETA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4

      - name: Check private IPA link exists
        env:
          IPA_DOWNLOAD_URL: ${{ secrets.GTAV_IPA_URL }}
        run: |
          if [ -z "$IPA_DOWNLOAD_URL" ]; then
            echo "Configure repository secret GTAV_IPA_URL first (private direct HTTPS link)."
            exit 1
          fi

      - name: Download base IPA privately
        env:
          IPA_DOWNLOAD_URL: ${{ secrets.GTAV_IPA_URL }}
        run: |
          curl --fail --location --retry 3 --show-error \
            --output "$RUNNER_TEMP/base.ipa" "$IPA_DOWNLOAD_URL"
          unzip -t "$RUNNER_TEMP/base.ipa" > /dev/null

      - name: Compile overlay and inject into IPA
        run: |
          bash build_custom_buttons.sh \
            "$RUNNER_TEMP/base.ipa" \
            "$RUNNER_TEMP/GTAV-v11.2_CustomButtons_BETA_UNSIGNED.ipa"

      - name: Upload unsigned test IPA
        uses: actions/upload-artifact@v4
        with:
          name: GTAV-v11.2-CustomButtons-BETA-UNSIGNED
          path: ${{ runner.temp }}/GTAV-v11.2_CustomButtons_BETA_UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 1
