name: Build Dynamic Vehicle FPV for GTA V iOS v11.1

on:
  push:
    paths:
      - 'DynamicVehicleFirstPersonIOS.2.cs'
      - 'DynamicVehicleFirstPersonIOS.csproj'
      - 'refs/**'
      - 'DFPV_iOS.ini'
      - '.github/workflows/build-dfpv-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check references and compile
        run: |
          set -euo pipefail
          test -s refs/ScriptHookVDotNet2.dll
          test -s refs/System.Windows.Forms.dll
          dotnet build DynamicVehicleFirstPersonIOS.csproj -c Release
      - name: Package iOS-importable mod
        run: |
          set -euo pipefail
          mkdir -p out/scripts
          cp bin/Release/net8.0/DynamicVehicleFirstPersonIOS.dll out/scripts/
          cp DFPV_iOS.ini out/scripts/
          cp README_VI.md out/README_VI.md
          cp REPORT_VI.md out/REPORT_VI.md
          cd out
          sha256sum scripts/DynamicVehicleFirstPersonIOS.dll > SHA256SUMS.txt
          zip -q -r ../DFPV_iOS_v11.1_R2_TEST.zip scripts README_VI.md REPORT_VI.md SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DFPV_iOS_v11_1_R2_TEST
          path: DFPV_iOS_v11.1_R2_TEST.zip
          if-no-files-found: error
