name: GTA v13.3 E3 Game Native Invocation Report (diagnostic only)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/rbp-e3-hardened-20261116
    paths:
      - 'ai-lab/projects/roleplay-ios/shv-e3-hardened/**'
      - '.github/workflows/rbp-v133-e3-hardened.yml'
permissions:
  contents: read
jobs:
  host-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Clang host mock UDP/native pipeline (no iPhone)
        run: |
          cd ai-lab/projects/roleplay-ios/shv-e3-hardened
          CC=clang bash tools/run_phase3_checks.sh
      - name: GCC host mock UDP/native pipeline (no iPhone)
        run: |
          cd ai-lab/projects/roleplay-ios/shv-e3-hardened
          CC=gcc bash tools/run_phase3_checks.sh
      - name: Phase 13 prepackaged IPA + Apple Development profile safety checks
        run: |
          cd ai-lab/projects/roleplay-ios/shv-e3-hardened
          python3 -m unittest discover -s tests -p 'test_phase13_preflight.py' -v
          python3 -m py_compile tools/verify_existing_probe_ipa.py tools/check_development_profile.py tools/resolve_signing_identity.py
          bash -n ios/sign_prepackaged_probe_macos.sh
  iphoneos-link:
    needs: host-regression
    # One explicit commit triggers one macOS build; other pushes run host checks only.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[E3-iOS]') }}
    # Reuse the Intel runner proven by PR #16; clang still targets iPhoneOS arm64.
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Xcode iPhoneOS unsigned diagnostic dylibs
        run: |
          cd ai-lab/projects/roleplay-ios/shv-e3-hardened
          bash ios/build_probe_macos.sh 0
          bash ios/build_probe_macos.sh 1
          bash ios/build_probe_macos.sh 3
      - name: Upload UNSIGNED diagnostics only
        uses: actions/upload-artifact@v4
        with:
          name: RBP-v133-E3-HARDENED-UNSIGNED-NOT-DEVICE-TESTED
          path: ai-lab/projects/roleplay-ios/shv-e3-hardened/build/ios-e*/
          if-no-files-found: error
          retention-days: 7
