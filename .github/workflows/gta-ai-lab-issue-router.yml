name: GTA AI Lab - Issue Triage
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: read
  issues: write
jobs:
  route-issue:
    if: ${{ (github.event.action == 'opened' && startsWith(github.event.issue.title, '[AI]')) || (github.event.action == 'labeled' && github.event.label.name == 'ai-lab') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route specialists from issue title
        env:
          TASK: ${{ github.event.issue.title }}
        run: |
          mkdir -p ai-lab/reports
          python ai-lab/dispatcher.py plan --task "$TASK" --top 5 --output ai-lab/reports/issue-plan.json
      - name: Post planning result to issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('ai-lab/reports/issue-plan.json', 'utf8'));
            const roles = data.agents.map(a => '- ' + a.id + ': ' + a.name + ' (' + a.team + ')').join('\n');
            const body = '**GTA AI Lab — Tự động phân công chuyên gia**\n\n' + roles +
              '\n\nĐây mới là kế hoạch phân công, chưa gọi AI API, chưa sửa mã nguồn và chưa kiểm thử IPA thật.';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });
      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: ai-lab-issue-plan
          path: ai-lab/reports/issue-plan.json
          retention-days: 7
