name: Build GTA V iOS v11.3 CustomTouch module

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build for iOS arm64 using Xcode SDK
        run: bash ./build_on_mac.sh ./dist
      - name: Check Mach-O architecture
        run: xcrun lipo -info dist/libCustomTouch.dylib
      - name: Upload compiled test module
        uses: actions/upload-artifact@v4
        with:
          name: customtouch-v11-3-arm64-experimental
          path: dist/libCustomTouch.dylib
