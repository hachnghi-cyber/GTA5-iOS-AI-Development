          }
          p->nonce=src;p->seen=s->now;p->sequence=m.sequence;p->police=(int)m.police;return;
         }
         if(m.kind<RP_CUFF||m.kind>RP_ACK_RELEASE||m.target!=s->self||dst!=s->nonce||
            !m.transaction||!fresh(s,m.sender)||p->nonce!=src||(int32_t)(m.sequence-p->sequence)<=0)return;
         p->sequence=m.sequence; /* only HELLO renews peer availability and role */
