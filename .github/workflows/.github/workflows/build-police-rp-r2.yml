        /* 244-byte stock envelope. Only fixed-width values go onto the network. */
        typedef struct {
         uint32_t outer, reserved0, sender, reserved1, opcode, stock_seq, job_token;
         uint32_t magic, version, kind, target, nonce_lo, nonce_hi;
         uint32_t target_lo, target_hi, transaction, sequence, police;
