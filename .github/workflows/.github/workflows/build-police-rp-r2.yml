        typedef struct {
         uint64_t nonce; uint32_t seen, sequence; int police;
        } RPPeer;
        typedef struct {
         void *ctx;
         void (*send)(void *,const RPMessage *,uint32_t);
         int (*near)(void *,unsigned); /* local world validation, no packet positions */
         int (*cuffs)(void *,int); /* ACK only after local adapter accepts application */
         void (*notice)(void *,const char *);
