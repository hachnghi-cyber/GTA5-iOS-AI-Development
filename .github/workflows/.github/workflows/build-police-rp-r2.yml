          PoliceRP-R2/Source/rp_core.c PoliceRP-R2/Tests/test_core.c -o build/test_core
        ASAN_OPTIONS=detect_leaks=0 build/test_core
        cc -D_DARWIN_C_SOURCE -D_DEFAULT_SOURCE -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
          PoliceRP-R2/Source/rp_core.c PoliceRP-R2/Tests/test_adapter.c -o build/test_adapter
        ASAN_OPTIONS=detect_leaks=0 build/test_adapter
        python3 -m py_compile PoliceRP-R2/Tools/patch_ipa.py
    - name: Build iOS device library
      shell: bash
      run: |
        set -euo pipefail
        sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
        xcrun --sdk iphoneos clang -target arm64-apple-ios16.3 \
          -isysroot "$sdk_path" -D_DARWIN_C_SOURCE -std=c11 -O2 -Wall -Wextra -Werror \
          -fvisibility=hidden -fstack-protector-strong -dynamiclib \
          PoliceRP-R2/Source/rp_core.c PoliceRP-R2/Source/ios_adapter.c \
          -Wl,-install_name,@executable_path/Frameworks/PoliceRP_R2.dylib \
          -Wl,-exported_symbol,_PRPFrame -Wl,-exported_symbol,_PRPWorkTask \
          -o build/PoliceRP_R2.dylib
        xcrun lipo -info build/PoliceRP_R2.dylib
        xcrun nm -gU build/PoliceRP_R2.dylib
        xcrun otool -l build/PoliceRP_R2.dylib > build/MachO-load-commands.txt
        shasum -a 256 build/PoliceRP_R2.dylib > build/SHA256.txt
        cp PoliceRP-R2/README_VI.md build/
