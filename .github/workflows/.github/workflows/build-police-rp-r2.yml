          code=stub(cave,ds,original,name);require(cave+len(code)<first,'stub overlaps text')
          replace(cave,code,True);replace(call,struct.pack('<I',branch(call,cave,True)))
         require(len(b)==len(game),'executable size changed');pm=parse(b)
         require(pm['uuid']==UUID and LOAD_NAME[:-1] in pm['names'],'patched Mach-O validation')
         require(pm['sections']==m['sections'],'original section layout changed')
         spans=[(c['offset'],c['offset']+c['size']) for c in changes]
         for i,(old,new) in enumerate(zip(game,b)):
          if old!=new:require(any(a<=i<z for a,z in spans),'unexpected byte modification')
         with zipfile.ZipFile(ipa) as zin,zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as zout:
          for item in zin.infolist():zout.writestr(copy(item),bytes(b) if item.filename==GAME else zin.read(item.filename))
          info=zipfile.ZipInfo(DYLIB);info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100755<<16;zout.writestr(info,dylib)
         with zipfile.ZipFile(ipa) as old,zipfile.ZipFile(out) as new:
          require(new.testzip() is None,'output CRC');require(set(new.namelist())==set(old.namelist())|{DYLIB},'unexpected file set')
          for name in old.namelist():
           if name!=GAME:require(old.read(name)==new.read(name),'changed original resource: '+name)
         report=dict(status='EXPERIMENTAL_UNSIGNED_NOT_DEVICE_TESTED',source_sha256=EXPECTED_IPA,output_sha256=sha(Path(out).read_bytes()),
                     dylib_sha256=sha(dylib),changes=changes,dlsym_stub=hex(ds),original_resources_preserved=True,
                     crc_pass=True,ios_runtime_tested=False,online_two_device_tested=False)
         Path(str(out)+'.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
        if __name__=='__main__':
