         if(m.kind==RP_ACK_CUFF&&s->phase==RP_REQUESTING){s->phase=RP_HOLDING;note(s,"RP: may nguoi choi da xac nhan cong");}
         if(m.kind==RP_ACK_RELEASE&&s->phase==RP_RELEASING){clear_out(s);note(s,"RP: may nguoi choi da xac nhan tha");}
        }
