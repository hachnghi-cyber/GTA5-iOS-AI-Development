          if(s->released_owner==m.sender&&s->released_nonce==src&&s->released_tx==m.transaction)return;
          if(!s->io.cuffs(s->io.ctx,1))return;
          s->owner=m.sender;s->owner_nonce=src;s->owner_tx=m.transaction;s->cuffed=1;
          s->lease_at=s->cuff_at=s->now;
