        #!/usr/bin/env python3
        """Exact-build offline patch. No runtime writes to executable pages."""
        import argparse,hashlib,json,struct,zipfile
        from pathlib import Path
        from copy import copy
        EXPECTED_IPA='23c039cb59e24f0107243a32252a3a60fbca1c934ac482d285109c323132f0dc'
        EXPECTED_GAME='d252115585d8f81987fa88138e89e190d42a7ca8134421f0a5f639af27c8585b'
        UUID='6a498e32e70c334cbca3affd35e8d171'
        LOAD_NAME=b'@executable_path/Frameworks/PoliceRP_R2.dylib\0'
        GAME='Payload/GTAV.app/GTA5'
        DYLIB='Payload/GTAV.app/Frameworks/PoliceRP_R2.dylib'
        def require(ok,msg):
         if not ok:raise ValueError(msg)
        def sha(b):return hashlib.sha256(b).hexdigest()
        def parse(b):
         require(len(b)>=32,'short Mach-O')
         magic,cpu,subtype,ft,n,sz,flags,res=struct.unpack_from('<8I',b)
         require(magic==0xfeedfacf and cpu==0x100000c and subtype==0,'requires thin arm64 Mach-O, not arm64e')
         require(32+sz<=len(b),'load commands out of range')
         o=32;sections=[];uuid=None;symbols=[];indirect=[];platform=None;names=[]
         for _ in range(n):
          require(o+8<=32+sz,'missing load command');cmd,size=struct.unpack_from('<II',b,o)
          require(size>=8 and size%8==0 and o+size<=32+sz,'invalid command size')
          if cmd==0x1b:uuid=b[o+8:o+24].hex()
          if cmd==0x32:platform=struct.unpack_from('<I',b,o+8)[0]
          if cmd in (0xc,0xd,0x80000018):
           noff=struct.unpack_from('<I',b,o+8)[0];names.append(b[o+noff:o+size].split(b'\0')[0])
          if cmd==2:
           so,ns,st,ss=struct.unpack_from('<4I',b,o+8)
           require(so+16*ns<=len(b) and st+ss<=len(b),'symbol table bounds')
           for i in range(ns):
            ix,typ,sec,desc,addr=struct.unpack_from('<IBBHQ',b,so+16*i)
            require(ix<ss,'symbol string index')
            end=b.find(b'\0',st+ix,st+ss);require(end>=0,'unterminated symbol')
            symbols.append((b[st+ix:end].decode(),typ,addr))
          if cmd==0xb:
           io,ni=struct.unpack_from('<II',b,o+56);require(io+4*ni<=len(b),'indirect symbol bounds')
           indirect=list(struct.unpack_from('<'+'I'*ni,b,io))
          if cmd==0x19:
           seg,va,vs,fo,fs,maxp,initp,nsec,sgf=struct.unpack_from('<16sQQQQIIII',b,o+8)
           require(size>=72+80*nsec,'section table bounds')
           for j in range(nsec):
            x=struct.unpack_from('<16s16sQQIIIIIIII',b,o+72+80*j)
            sections.append(dict(name=x[0].split(b'\0')[0].decode(),addr=x[2],size=x[3],offset=x[4],flags=x[8],r1=x[9],r2=x[10],prot=initp))
          o+=size
         require(o==32+sz,'command size sum')
