         local_release(s);clear_out(s);s->enabled=0;
        }
        int rp_action(RPState *s,unsigned target){
         if(!s->enabled||!s->police||s->cuffed)return 0;
         if(s->phase!=RP_IDLE){
          s->phase=RP_RELEASING;s->out_started=s->now;s->out_sent=s->now;
          emit(s,s->out_peer,RP_RELEASE,s->out_tx,s->out_nonce);return 1;
         }
         if(target==s->self||!fresh(s,target)||!s->io.near(s->io.ctx,target))return 0;
         s->out_peer=target;s->out_nonce=s->peer[target].nonce;s->out_tx=++s->next_tx;
         if(!s->out_tx)s->out_tx=++s->next_tx;
         s->phase=RP_REQUESTING;s->out_started=s->out_sent=s->now;
         emit(s,target,RP_CUFF,s->out_tx,s->out_nonce);note(s,"RP: dang cho may kia xac nhan");return 1;
        }
        void rp_tick(RPState *s,uint32_t now,int police){
         if(!s->enabled)return;
         s->now=now;int changed=s->police!=!!police;s->police=!!police;
         if(changed||age(now,s->hello_at)>=1000){emit(s,RP_ALL,RP_HELLO,0,0);s->hello_at=now;}
         if(s->cuffed && (!fresh(s,s->owner)||s->peer[s->owner].nonce!=s->owner_nonce||
            !s->peer[s->owner].police||age(now,s->lease_at)>=RP_LEASE_MS||age(now,s->cuff_at)>=RP_MAX_CUFF_MS))local_release(s);
         if(s->phase==RP_IDLE)return;
         if(!s->police && s->phase!=RP_RELEASING){s->phase=RP_RELEASING;s->out_started=now;s->out_sent=now-500;}
         if(!fresh(s,s->out_peer)||s->peer[s->out_peer].nonce!=s->out_nonce){clear_out(s);return;}
         if(s->phase!=RP_HOLDING && age(now,s->out_started)>=3000){
          if(s->phase==RP_REQUESTING){emit(s,s->out_peer,RP_RELEASE,s->out_tx,s->out_nonce);note(s,"RP: khong nhan duoc xac nhan");}
