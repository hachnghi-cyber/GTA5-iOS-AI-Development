         replace(m['end'],cmd,True)
         replace(16,struct.pack('<II',m['n']+1,m['sz']+cmdsize))
         hooks=[(0xe5188,0xea024,0xe00,'PRPFrame'),(0xe6de0,0x112010,0xf00,'PRPWorkTask')]
         for call,original,cave,name in hooks:
