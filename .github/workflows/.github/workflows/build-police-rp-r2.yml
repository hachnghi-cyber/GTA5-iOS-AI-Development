        def stub(at,dlsym,fallback,name):
         # Preserve args x0..x2, frame pointer and LR across dlsym. Tailcall callback.
         words=[0xa9bd7bfd,0x910003fd,0xa90107e0,0xf90013e2,0x92800020,
                adr(at+20,at+56,1),branch(at+24,dlsym,True),0xaa0003f0,
                0xa94107e0,0xf94013e2,0xa8c37bfd,0xb4000050,0xd61f0200,
                branch(at+52,fallback)]
         return struct.pack('<14I',*words)+name.encode()+b'\0'
        def dlsym_stub(m):
         for sec in m['sections']:
          if sec['flags']&255!=8:continue
          stride=sec['r2'];require(stride>0,'stub stride zero')
          for i in range(sec['size']//stride):
           idx=m['indirect'][sec['r1']+i]
           if idx<len(m['symbols']) and m['symbols'][idx][0]=='_dlsym':return sec['addr']+i*stride-0x100000000
         raise ValueError('dlsym import stub not found')
        def patch(ipa,lib,out):
         raw=Path(ipa).read_bytes();require(sha(raw)==EXPECTED_IPA,'IPA differs from verified v12; refusing')
         dylib=Path(lib).read_bytes();dm=parse(dylib)
         require(dm['ft']==6 and dm['platform']==2,'library must be iOS MH_DYLIB, not macOS/simulator')
         require(LOAD_NAME[:-1] in dm['names'],'wrong dylib install name')
         exports={x[0] for x in dm['symbols'] if x[1]&15==15}
         require({'_PRPFrame','_PRPWorkTask'}<=exports,'missing hook exports')
         with zipfile.ZipFile(ipa) as z:
          require(z.testzip() is None,'input CRC');game=z.read(GAME)
         require(sha(game)==EXPECTED_GAME,'unexpected executable');m=parse(game)
         require(m['uuid']==UUID,'UUID mismatch')
         first=min(s['offset'] for s in m['sections'] if s['name']=='__text')
         require(first>=0x1000,'insufficient executable header space')
         ds=dlsym_stub(m);b=bytearray(game);changes=[]
         cmdsize=(24+len(LOAD_NAME)+7)&~7
         cmd=struct.pack('<6I',0xc,cmdsize,24,0,0,0)+LOAD_NAME
         cmd=cmd.ljust(cmdsize,b'\0')
         require(m['end']+len(cmd)<=0xe00,'load command collides with stubs')
         def replace(off,data,blank=False):
          require(off+len(data)<=len(b),'write bounds')
          if blank:require(not any(b[off:off+len(data)]),'patch space is occupied')
          old=bytes(b[off:off+len(data)]);b[off:off+len(data)]=data
