name: Police RP R2 iPhone ARM64
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Prepare bundled reviewed source
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p PoliceRP-R2/Source PoliceRP-R2/Tools PoliceRP-R2/Tests
        cat > 'PoliceRP-R2/README_VI.md' <<'PRP_BUNDLE_EOF_0'
        # PoliceRP R2 — mã nguồn thử nghiệm bắt người chơi Online trên v12

        Trạng thái: đã viết mã nguồn, kiểm thử giao thức trên máy tính và đối chiếu điểm vá với IPA. CHƯA biên dịch dylib iOS trong phiên này; CHƯA thử hai iPhone; CHƯA có IPA R2 hoàn thiện. Không nhập ZIP mã nguồn này vào mục Mods.

        ## Đã triển khai trong mã

        - Hai máy tự giới thiệu phiên bản RP và nonce 64-bit mới mỗi lần bật.
        - Cảnh sát gửi yêu cầu còng; máy mục tiêu kiểm tra phiên bản, người nhận, nonce, trình tự gói, vai trò đã quảng bá, khoảng cách và trạng thái nhân vật trước khi áp dụng.
        - Chỉ báo nhận được xác nhận sau ACK của máy mục tiêu. Đây là ACK áp dụng cờ handcuffs ở máy mục tiêu, chưa phải bằng chứng animation còng và giới hạn điều khiển đã hoạt động trên thiết bị thật.
        - Còng/tháo còng có gửi lại, giới hạn chờ 3 giây. Máy mục tiêu tự tháo khi thiếu heartbeat 2,5 giây, peer hết hạn hoặc hết 60 giây thử nghiệm.
        - Chết, đổi ped hoặc mất trạng thái Online: dừng RP, trả cờ còng đã thay đổi nếu còn đúng thực thể, cần bật F9 lại. Hạn chế điều khiển chỉ áp dụng từng frame, không ghi vĩnh viễn vào cấu hình.
        - Chặn thực thi MacportWorkTaskFrame khi RP bật, đang Online và nhận ca cảnh sát (job 0..2). Nhận ca/trang phục/xe do bản gốc quản lý. Không nhét player ped vào slot NPC, không gọi cleanup NPC cho player.
        - IPA patcher kiểm SHA256/UUID, thêm dylib và hai hook tĩnh. Không sửa trang mã executable khi game đang chạy.
        - Ghi log Documents/PoliceRP-R2.log; mỗi lần mở ứng dụng ghi mới để không tích luỹ vô hạn.

        ## Chưa có

        - Chưa kiểm thử Online thật; có thể đường gửi/nhận, phím custom hoặc vị trí hook chưa hoạt động ở runtime.
        - Chưa làm áp giải, đưa lên xe, đưa về đồn, nhà tù, tiền phạt hoặc giao diện chọn tên. Bản đầu chỉ thử còng/tháo và hạn chế điều khiển.
        - Chưa thêm animation còng đồng bộ. Không gọi MacportWorkArrestScene vì helper đó dùng trạng thái scene nghề NPC.
        - Đây là phòng RP hợp tác: cả hai máy bật RP và cài cùng phiên bản. Chưa có host phê duyệt vai trò, chống client gian lận hay xử lý host migration được kiểm chứng. Không phải FiveM và không dùng để bắt máy chạy IPA gốc.
        - Mục tiêu được chọn theo slot đầu tiên đủ điều kiện trong 3m, chưa phải nhân vật gần nhất hay menu chọn tên. Chỉ thử hai người, cả hai đi bộ.

        ## Build bằng GitHub Actions

        File `build-police-rp-r2.yml` được cung cấp riêng là workflow tự chứa toàn bộ mã nguồn. Chỉ cần tạo/thay file `.github/workflows/build-police-rp-r2.yml` trong repository, không cần upload thư mục nguồn và không cần đưa IPA lên GitHub. Workflow tự tạo nguồn trên máy build, chạy test và biên dịch dylib.

        Nếu dùng cấu trúc nguồn thông thường thay cho workflow tự chứa, đặt đúng hai đường dẫn ở gốc repository:

        1. `PoliceRP-R2/Source/ios_adapter.c` cùng toàn bộ thư mục PoliceRP-R2.
        2. `.github/workflows/build-police-rp-r2.yml`.

        Không đặt `.github` bên trong một thư mục bọc khác. Không cần xoá các mod cũ trong repository.

        Mở Actions → Police RP R2 iPhone ARM64 → Run workflow. Khi thành công, tải artifact `PoliceRP-R2-iPhone-ARM64-EXPERIMENTAL` rồi gửi ZIP artifact lại để ghép với IPA đã cung cấp. Artifact phải có `PoliceRP_R2.dylib` và SHA256.txt; build thành công vẫn chưa chứng minh chạy được trên iPhone.

        Workflow tự chứa chỉ xuất dylib và ZIP mã nguồn. Patcher trong mã nguồn dùng để ghép với IPA gốc tại đây hoặc trên Mac; không yêu cầu công khai IPA trong repository.

        Build thủ công trên Mac có Xcode:

        ```sh
        mkdir -p build
        sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
        xcrun --sdk iphoneos clang -target arm64-apple-ios16.3 -isysroot "$sdk_path" \
          -std=c11 -O2 -Wall -Wextra -Werror -fvisibility=hidden -fstack-protector-strong \
          -dynamiclib PoliceRP-R2/Source/rp_core.c PoliceRP-R2/Source/ios_adapter.c \
          -Wl,-install_name,@executable_path/Frameworks/PoliceRP_R2.dylib \
          -Wl,-exported_symbol,_PRPFrame -Wl,-exported_symbol,_PRPWorkTask \
          -o build/PoliceRP_R2.dylib
        python3 PoliceRP-R2/Tools/patch_ipa.py GTAV-v12.ipa build/PoliceRP_R2.dylib build/PoliceRP-R2-UNSIGNED.ipa
        ```

        IPA đầu vào phải có SHA256 `23c039cb59e24f0107243a32252a3a60fbca1c934ac482d285109c323132f0dc`. File GTAV-v12(2).ipa đã gửi khớp hash này. Patcher giữ nguyên bản gốc và từ chối phiên bản khác. IPA đầu ra cần ký lại toàn bộ app và dylib; chữ ký cũ không còn hợp lệ.

        ## Quy trình thử dự kiến sau khi build và ghép IPA

        1. Sao lưu save. Hai máy dùng cùng IPA R2, vào cùng phòng Online riêng, đi bộ.
        2. Khi chưa nhận ca, cả hai bấm F9 để bật RP. Dùng bàn phím hoặc mục phím mod/nút custom có hỗ trợ F9. Chưa thêm nút cảm ứng riêng trong R2.
        3. Máy cảnh sát chọn nghề cảnh sát và nhận ca. Máy mục tiêu vẫn để RP bật. Đợi ít nhất 2 giây để hai máy trao đổi HELLO.
        4. Đứng cách nhau dưới 3m, cả hai ngoài xe; cảnh sát bấm E. Thông báo chờ chưa có nghĩa bắt thành công.
        5. Chỉ khi có thông báo máy người chơi xác nhận mới kiểm tra phía mục tiêu: cờ còng, chạy/đi bộ, bắn và nút Pause. Chưa đảm bảo có animation tay sau lưng.
        6. Cảnh sát bấm E lần nữa để thả. Người bị còng có thể bấm F9 để thoát thử nghiệm ngay.
        7. Cảnh sát kết thúc ca trước khi đổi chế độ RP bằng F9. Khi RP tắt, nghề NPC gốc tiếp tục hoạt động.
        8. Nếu không hoạt động, gửi PoliceRP-R2.log của CẢ HAI máy và run.log nếu crash. `tx_attempts` chỉ là số lần gọi hàm gửi, không chứng minh gói đã đến; `rx_scan_matches` có thể đếm lại event trong ring, còn `peers` cho biết HELLO đang hợp lệ.

        ## Kiểm tra đã chạy trong phiên phát triển

        - Giao thức C: 14 kịch bản, 50.000 đầu vào lỗi; AddressSanitizer và UndefinedBehaviorSanitizer không báo lỗi với leak detection tắt vì môi trường chạy không hỗ trợ LeakSanitizer.
        - 8 kiểm tra Python trên IPA gốc: hash/UUID, điểm BL, header trống, import dlsym, offset hàm/vtable và giải mã stub ARM64 bằng LLVM.
        - Kiểm thử adapter với hàm engine giả lập: đọc ring, nhận HELLO/CUFF và phát ACK sau thay cờ, F9 khôi phục, điều khiển hết hạn, gọi JobsUpdate gốc, nhánh ngừng NPC, loại mục tiêu trong xe. Các test này chạy mã adapter thật nhưng không chạy engine iOS.
        - C adapter: kiểm tra cú pháp với GCC và warnings-as-errors. Đây KHÔNG thay thế biên dịch bằng iPhoneOS SDK.
        - Chưa chạy workflow GitHub, chưa tạo dylib iOS, chưa xác minh khởi động IPA hay kết nối hai máy.

        ## Kết quả reverse engineering mới

        - `CScriptedGameEvent::Decide` tại 0x10190f6f8 chuyển netPlayer nguồn sang constructor CEventNetworkScriptEvent.
        - Constructor tại 0x1006aa770 sửa byte sender trong payload+8 dựa trên netPlayer+33 rồi sao chép payload vào event+25.
        - Vtable event: 0x102647820 (symbol vtable +16). Clone cuối cùng dùng lại vtable này.
        - Ring event: count+4016, head+4012, 500 con trỏ tại +8; receiver sao chép và không sửa/xoá event của game.
        - Gói 244 byte dùng marker riêng ở +28, opcode 0x52500002; nhánh opcode không biết của JobsUpdate quay lại vòng quét. Các trường do stock sender quản lý không dùng làm trạng thái RP.
        - Hai BL: 0xe5188 → JobsUpdate, 0xe6de0 → WorkTaskFrame. Stub gọi dlsym đã có trong executable, giữ x0/x1/x2/x29/LR và fallback về hàm gốc nếu thiếu export.

        Tất cả địa chỉ trên là VM address chưa cộng ASLR (trừ hai BL nêu theo file offset). Vai trò police ở R2 vẫn do peer quảng bá, chưa có xác thực host; source sender do engine sửa không làm toàn bộ giao thức trở thành hệ thống chống gian lận.

        Nguồn Internet tham khảo kiến trúc, không dùng offset FiveM cho iOS:
        - https://docs.fivem.net/docs/scripting-manual/networking/ids/
        - https://docs.fivem.net/docs/developers/server-security/
        - https://docs.fivem.net/docs/scripting-manual/working-with-events/triggering-events/
        PRP_BUNDLE_EOF_0
        cat > 'PoliceRP-R2/Source/ios_adapter.c' <<'PRP_BUNDLE_EOF_1'
        /* Exact GTA5 v12 UUID only. Experimental, cooperative RP, not FiveM. */
        #include "rp_core.h"
        #include <stdint.h>
        #include <string.h>
        #include <stdlib.h>
        #include <stdio.h>
        #include <time.h>
        extern const void *_dyld_get_image_header(uint32_t);
        typedef struct {float x;uint32_t p0;float y;uint32_t p1;float z;uint32_t p2;} Vec;
        static uintptr_t base;
        static RPState state;
        static int ready, applied_ped, previous_cuffs, session_ped;
        static uintptr_t applied_entity;
        static unsigned session_slot;
        static FILE *logfile;
        static uint32_t tx_attempts,rx_matches,invalid_rings,diag_at;
        #ifndef FN
        #define FN(off,T) ((T)(base+(off)))
        #endif
        #ifndef I32
        #define I32(off) (*(const int32_t *)(base+(off)))
        #endif
        #ifndef U8
        #define U8(off) (*(const uint8_t *)(base+(off)))
        #endif
        static uint32_t now_ms(void){
         struct timespec t;
         if(clock_gettime(CLOCK_MONOTONIC,&t))return 0;
         return (uint32_t)((uint64_t)t.tv_sec*1000+(uint64_t)t.tv_nsec/1000000);
        }
        static void logline(const char *s){
         if(!logfile){const char *home=getenv("HOME");char path[1024];
          if(home && snprintf(path,sizeof(path),"%s/Documents/PoliceRP-R2.log",home)<(int)sizeof(path))logfile=fopen(path,"w");}
         if(logfile){fprintf(logfile,"%u %s\n",now_ms(),s);fflush(logfile);}
        }
        static void notice(void *ctx,const char *s){(void)ctx;logline(s);FN(0x10e6ec,void(*)(const char *))(s);}
        static int exists(int p){return p && FN(0xc39174,int(*)(int))(p);}
        static int alive(int p){return exists(p)&&!FN(0xc3d298,int(*)(int,int))(p,0);}
        static int selfped(void){return FN(0xd62d70,int(*)(void))();}
        static int active(unsigned slot){return slot<32 && FN(0xf6fbc,int(*)(int))((int)slot);}
        static int ped(unsigned slot){return active(slot)?FN(0xd60a48,int(*)(int))((int)slot):0;}
        static int online(void){return I32(0x27b1ae8)==3 && U8(0x355577d)==1 && U8(0x35501fc)==1;}
        static int police(void){return I32(0x27b1b2c)>=0&&I32(0x27b1b2c)<=2&&U8(0x355ee34)==1;}
        static int near(void *ctx,unsigned slot){
         (void)ctx;int a=selfped(),b=ped(slot);if(a==b||!alive(a)||!alive(b))return 0;
         if(FN(0xd252f4,int(*)(int,int))(a,0)||FN(0xd252f4,int(*)(int,int))(b,0))return 0;
         Vec av=FN(0xc3ab68,Vec(*)(int,int))(a,1),bv=FN(0xc3ab68,Vec(*)(int,int))(b,1);
         float dx=av.x-bv.x,dy=av.y-bv.y,dz=av.z-bv.z,d=dx*dx+dy*dy+dz*dz;
         return d>=0.0f&&d<=9.0f; /* NaN/Inf rejected by comparisons */
        }
        static int cuffs(void *ctx,int on){
         (void)ctx;
         if(!on){
          /* Never restore a stale GUID onto a newly spawned/reused entity. */
          if(applied_ped && exists(applied_ped) && (uintptr_t)FN(0x22f58,void *(*)(int))(applied_ped)==applied_entity)
           FN(0xd281c4,void(*)(int,int))(applied_ped,previous_cuffs);
          applied_ped=0;applied_entity=0;return 1;
         }
         int p=selfped();if(!alive(p))return 0;
         uintptr_t entity=(uintptr_t)FN(0x22f58,void *(*)(int))(p);if(!entity)return 0;
         previous_cuffs=(*(const uint32_t *)(entity+5232)&0x01000000u)!=0;
         if(previous_cuffs)return 0; /* do not take ownership of another mod's restraint */
         FN(0xd281c4,void(*)(int,int))(p,1);
         if(!(*(const uint32_t *)(entity+5232)&0x01000000u))return 0;
         applied_ped=p;applied_entity=entity;return 1;
        }
        static void send_message(void *ctx,const RPMessage *message,uint32_t mask){
         (void)ctx;if(!online())return;
         unsigned me=(unsigned)FN(0xd62d30,int(*)(void))();if(me>=32)return;
         uint32_t present=0;for(unsigned i=0;i<32;i++)if(i!=me && (mask&(1u<<i)) && active(i))present|=1u<<i;
         if(!present)return;
         RPMessage m=*message;
         tx_attempts++;
         /* This function owns sequence allocation and network event construction. */
         FN(0xf5e34,void(*)(RPMessage *,uint32_t,uint32_t))(&m,RP_OPCODE,present);
        }
        static int key(int vk){
         void *kb=(void *)(base+0x2d51c88);
         int (*f)(void *,int,int,const char *,const char *)=FN(0xe8de64,int(*)(void *,int,int,const char *,const char *));
         return f(kb,vk,0,0,0)||f(kb,vk,3,0,0);
        }
        static int check_image(void){
         const uint8_t *b=_dyld_get_image_header(0);uint32_t magic,ncmd,size;
         if(!b)return 0;
         memcpy(&magic,b,4);memcpy(&ncmd,b+16,4);memcpy(&size,b+20,4);
         if(magic!=0xfeedfacf||ncmd>100||size>0x3000)return 0;
         const uint8_t expected[16]={0x6a,0x49,0x8e,0x32,0xe7,0x0c,0x33,0x4c,0xbc,0xa3,0xaf,0xfd,0x35,0xe8,0xd1,0x71};
         uint32_t off=32;
         for(uint32_t i=0;i<ncmd;i++){
          uint32_t cmd,sz; if(off+8>32+size)return 0;
          memcpy(&cmd,b+off,4);memcpy(&sz,b+off+4,4);
          if(sz<8||off+sz>32+size)return 0;
          if(cmd==0x1b&&sz==24&&!memcmp(b+off+8,expected,16)){base=(uintptr_t)b;return 1;}
          off+=sz;
         }return 0;
        }
        static void receive_messages(void){
         uint8_t *group=FN(0x69046c,uint8_t *(*)(void))();if(!group)return;
         int32_t count,head;memcpy(&count,group+4016,4);memcpy(&head,group+4012,4);
         if(count<0||count>500||head<0||head>=500){invalid_rings++;return;}
         for(int i=1;i<=count;i++){
          uint8_t *event;memcpy(&event,group+8+8*((head+i)%500),8);if(!event)continue;
          uintptr_t vt;memcpy(&vt,event,8);
          /* CEventNetworkScriptEvent's exact vtable, set in constructor at 0x6aa7b8. */
          if(vt!=base+0x2647820u)continue;
          RPMessage m;memcpy(&m,event+25,sizeof(m));
          /* Constructor corrects payload sender byte from engine netPlayer+33.
             Full sender must still be <32. This is not hostile-client authentication. */
          if(m.outer==RP_OUTER&&m.magic==RP_MAGIC&&m.opcode==RP_OPCODE){rx_matches++;rp_receive(&state,&m,sizeof(m));}
         }
        }
        static void restrict_controls(void){
         if(!state.cuffed)return;
         /* Leave Pause, camera and custom F9 available. Per-frame disable auto-expires. */
         static const int controls[]={21,22,23,24,25,30,31,37,44,45,47,58,140,141,142,143,257,263,264};
         for(unsigned i=0;i<sizeof(controls)/sizeof(controls[0]);i++)FN(0xd1b904,void(*)(int,int,int))(0,controls[i],1);
        }
        __attribute__((visibility("default")))
        void PRPFrame(void *player,int networkMode){
         if(!ready){if(!check_image())return;ready=1;logline("R2 loaded; F9 toggles cooperative RP; default OFF");}
         int valid=online();int me=valid?selfped():0;
         unsigned slot=valid?(unsigned)FN(0xd62d30,int(*)(void))():RP_NONE;
         if(state.enabled && (!valid||!alive(me)||me!=session_ped||slot!=session_slot)){
          rp_stop(&state);logline("RP stopped: session/death/ped change; re-enable F9");
         }
         if(valid&&key(0x78)){
          if(state.enabled && (state.cuffed||!U8(0x355ee34))){rp_stop(&state);notice(0,"RP: da tat");}
          else if(U8(0x355ee34)){notice(0,"RP: ket thuc ca truoc khi doi che do");}
          else if(alive(me)&&slot<32){
           uint64_t n;do{arc4random_buf(&n,sizeof(n));}while(!n);
           RPIO io={0,send_message,near,cuffs,notice};rp_init(&state,io,slot,n,now_ms());
           session_ped=me;session_slot=slot;notice(0,"RP: da bat; ca hai may can bat F9");
          }
         }
         if(state.enabled){
          rp_tick(&state,now_ms(),police());receive_messages();
          if((uint32_t)(state.now-diag_at)>=5000){
           unsigned peers=0;for(unsigned i=0;i<32;i++)if(state.peer[i].nonce&&(uint32_t)(state.now-state.peer[i].seen)<RP_PEER_MS)peers++;
           char line[192];snprintf(line,sizeof(line),"diag tx_attempts=%u rx_scan_matches=%u peers=%u phase=%u cuffed=%d invalid_ring=%u",
            tx_attempts,rx_matches,peers,state.phase,state.cuffed,invalid_rings);logline(line);diag_at=state.now;
          }
          if(police()&&!state.cuffed && (key(0x45)||FN(0xd1aeb8,int(*)(int,int))(0,51))){
           unsigned target=RP_NONE;
           /* First compatible nearby peer in deterministic slot order. */
           for(unsigned i=0;i<32;i++)if(i!=slot&&state.peer[i].nonce&&near(0,i)){target=i;break;}
           if(!rp_action(&state,target))notice(0,"RP: chua thay nguoi choi bat RP trong 3m");
          }
         }
         FN(0xea024,void(*)(void *,int))(player,networkMode);
         restrict_controls();
        }
        __attribute__((visibility("default")))
        int PRPWorkTask(void *task,int p,const void *position){
         if(!ready && !check_image())return 0;
         /* No player handle is ever written into stock NPC state. Return 0 = in progress. */
         if(state.enabled&&online()&&police())return 0;
         return FN(0x112010,int(*)(void *,int,const void *))(task,p,position);
        }
        PRP_BUNDLE_EOF_1
        cat > 'PoliceRP-R2/Source/rp_core.c' <<'PRP_BUNDLE_EOF_2'
        #include "rp_core.h"
        #include <string.h>
        static uint64_t nonce(uint32_t lo,uint32_t hi){return (uint64_t)lo|((uint64_t)hi<<32);}
        static uint32_t age(uint32_t now,uint32_t then){return now-then;}
        static int fresh(RPState *s,unsigned p){return p<32 && s->peer[p].nonce && age(s->now,s->peer[p].seen)<RP_PEER_MS;}
        static void note(RPState *s,const char *t){if(s->io.notice)s->io.notice(s->io.ctx,t);}
        static void emit(RPState *s,unsigned target,unsigned kind,uint32_t tx,uint64_t dst){
         RPMessage m={0};m.outer=RP_OUTER;m.sender=s->self;m.opcode=RP_OPCODE;
         m.magic=RP_MAGIC;m.version=RP_VERSION;m.kind=kind;m.target=target;
         m.nonce_lo=(uint32_t)s->nonce;m.nonce_hi=(uint32_t)(s->nonce>>32);
         m.target_lo=(uint32_t)dst;m.target_hi=(uint32_t)(dst>>32);
         m.transaction=tx;m.sequence=++s->sequence;m.police=(uint32_t)s->police;
         s->io.send(s->io.ctx,&m,target==RP_ALL?RP_ALL:(1u<<target));
        }
        static void local_release(RPState *s){
         if(s->cuffed){s->io.cuffs(s->io.ctx,0);note(s,"RP: da thao cong");}
         s->released_owner=s->owner;s->released_nonce=s->owner_nonce;s->released_tx=s->owner_tx;
         s->cuffed=0;s->owner=RP_NONE;s->owner_nonce=0;s->owner_tx=0;
        }
        static void clear_out(RPState *s){s->phase=RP_IDLE;s->out_peer=RP_NONE;s->out_nonce=0;s->out_tx=0;}
        void rp_init(RPState *s,RPIO io,unsigned self,uint64_t n,uint32_t now){
         memset(s,0,sizeof(*s));s->io=io;s->self=self;s->nonce=n;s->now=now;
         s->enabled=self<32&&n!=0;s->owner=RP_NONE;s->out_peer=RP_NONE;s->released_owner=RP_NONE;
         s->hello_at=now-1000;
        }
        void rp_stop(RPState *s){
         if(!s->enabled)return;
