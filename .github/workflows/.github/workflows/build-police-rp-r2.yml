         if(age(now,s->out_sent)>=500){
          emit(s,s->out_peer,s->phase==RP_REQUESTING?RP_CUFF:s->phase==RP_HOLDING?RP_KEEP:RP_RELEASE,s->out_tx,s->out_nonce);
