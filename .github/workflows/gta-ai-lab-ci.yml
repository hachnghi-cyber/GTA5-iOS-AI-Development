name: GTA AI Lab - Automated CI
on:
  push:
    paths:
      - 'ai-lab/**'
      - 'police-rp/**'
      - '.github/workflows/gta-ai-lab-ci.yml'
  pull_request:
    paths:
      - 'ai-lab/**'
      - 'police-rp/**'
      - '.github/workflows/gta-ai-lab-ci.yml'
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Optional agent selection task'
        required: false
        default: 'SIGSEGV crash after Menyoo vehicle spawn'
permissions:
  contents: read
concurrency:
  group: gta-ai-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scripts
        run: python -m compileall -q ai-lab
      - name: Unit tests
        run: python -m unittest discover -s ai-lab/tests -v
      - name: Validate project state and export handoff
        run: |
          python ai-lab/continuity.py validate
          python ai-lab/continuity.py handoff --output ai-lab/reports/RP_HANDOFF.md
      - name: Enforce P0-P9 sequential phase gate (read-only)
        run: python ai-lab/sequential_gate.py --output ai-lab/reports/RP_PHASE_STATUS.json
      - name: Audit pinned P0 source provenance (preview only)
        if: github.head_ref == 'feature/rp-p0-integration-preview-20261113' || github.ref_name == 'feature/rp-p0-integration-preview-20261113'
        run: python ai-lab/p0_integration_audit.py --output ai-lab/reports/RP_P0_AUDIT.json
      - name: Inventory Roleplay sources (no IPA required)
        run: python ai-lab/source_inventory.py --output ai-lab/reports/RP_SOURCE_INVENTORY.json
      - name: Compile and execute Police RP C host regressions (not iPhone)
        run: python ai-lab/host_rp_tests.py --output ai-lab/reports/RP_HOST_C_TESTS.json
      - name: Clang UndefinedBehaviorSanitizer Police RP host regressions
        run: |
          command -v clang
          python ai-lab/host_rp_tests.py --compiler clang --sanitize-undefined --output ai-lab/reports/RP_HOST_C_UBSAN.json
      - name: Clang AddressSanitizer and UBSan Police RP host regressions
        run: |
          command -v clang
          python ai-lab/host_rp_tests.py --compiler clang --sanitize-address --sanitize-undefined --output ai-lab/reports/RP_HOST_C_ASAN_UBSAN.json
      - name: Route specialists
        env:
          TASK: ${{ inputs.task || 'SIGSEGV crash after Menyoo vehicle spawn' }}
        run: |
          mkdir -p ai-lab/reports
          python ai-lab/dispatcher.py plan --task "$TASK" --top 5 --output ai-lab/reports/plan.json
      - name: Upload routing and continuation reports
        uses: actions/upload-artifact@v4
        with:
          name: gta-ai-lab-plan
          path: |
            ai-lab/reports/plan.json
            ai-lab/reports/RP_HANDOFF.md
            ai-lab/reports/RP_SOURCE_INVENTORY.json
            ai-lab/reports/RP_PHASE_STATUS.json
            ai-lab/reports/RP_P0_AUDIT.json
            ai-lab/reports/RP_HOST_C_TESTS.json
            ai-lab/reports/RP_HOST_C_UBSAN.json
            ai-lab/reports/RP_HOST_C_ASAN_UBSAN.json
          retention-days: 7
