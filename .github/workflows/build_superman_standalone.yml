name: Build Superman standalone ScriptHook mod v11.3

on:
  workflow_dispatch:
  push:
    paths:
      - 'superman_standalone_v113/**'
      - '.github/workflows/build_superman_standalone.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore NuGet packages
        run: dotnet restore superman_standalone_v113/SupermanStandaloneSHVDN.csproj
      - name: Build the .NET Framework 4.8 plugin DLL
        run: dotnet build superman_standalone_v113/SupermanStandaloneSHVDN.csproj --no-restore --configuration Release
      - name: Package IMPORT SCRIPT mod ZIP
        shell: pwsh
        run: |
          $source = 'superman_standalone_v113/bin/Release/net48/SupermanStandaloneSHVDN.dll'
          if (!(Test-Path $source)) { throw 'Missing compiled DLL' }
          $stage = Join-Path $env:RUNNER_TEMP 'SupermanStandalone-import'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $source (Join-Path $stage 'SupermanStandaloneSHVDN.dll')
          $destination = Join-Path $env:RUNNER_TEMP 'SupermanStandalone-v11.3-IMPORT.zip'
          Compress-Archive -Path (Join-Path $stage '*.dll') -DestinationPath $destination -Force
          Get-FileHash $source -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: SupermanStandalone-v11.3-IMPORT
          path: ${{ runner.temp }}/SupermanStandalone-v11.3-IMPORT.zip
          if-no-files-found: error
          retention-days: 14
