name: Police RP v1.7 - Build visual roster OBSERVE ONLY
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Import source and check unit tests
        shell: bash
        run: |
          set -euo pipefail
          test -f PoliceRP_v17_Source.zip
          mkdir -p src_v17 out
          unzip -oq PoliceRP_v17_Source.zip -d src_v17
          python3 -m unittest discover -s src_v17/Tests -p 'test_*.py' -v
      - name: Build iOS iPhone arm64 diagnostic dylib
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.3 \
            -std=c11 -O2 -Wall -Wextra -Werror -fvisibility=hidden -dynamiclib \
            -Wl,-install_name,@executable_path/Frameworks/PoliceRPProbe.dylib \
            src_v17/Diagnostics/PoliceRPRosterProbe.c -o out/PoliceRPProbe.dylib
          xcrun lipo -info out/PoliceRPProbe.dylib
          xcrun otool -D out/PoliceRPProbe.dylib
          xcrun vtool -show-build out/PoliceRPProbe.dylib > out/build_version.txt
          shasum -a 256 out/PoliceRPProbe.dylib > out/sha256.txt
          echo 'v1.7 passive visual-tag slot probe; NOT player roster nor arrest functionality' > out/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PRP-v17-iPhone-ARM64-ROSTER-OBSERVE-ONLY
          path: out/
          retention-days: 7
